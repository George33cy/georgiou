<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"
/>

<style>
  footer {
    background-color: #000;
    color: #fff;
    text-align: center;
    padding: 1.8rem 1rem;
    font-size: 1.2rem;
    margin-top: 2rem;
  }

  .footer-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
  }

  .copyright {
    color: #ffffff;
    font-size: 1.2rem;
    font-weight: 400;
  }

  .footer-icons {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    flex-wrap: wrap;
  }

  .footer-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background-color: #00a6d6;
    color: #000;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .footer-icon:hover {
    transform: translateY(-3px) scale(1.08);
    box-shadow: 0 4px 12px rgba(255, 255, 255, 0.25);
  }

  .footer-icon i {
    font-size: 28px;
    color: #000;
  }

  @media (max-width: 700px) {
    footer {
      padding: 1.5rem 1rem;
    }

    .copyright {
      font-size: 1rem;
    }

    .footer-icons {
      gap: 0.9rem;
    }

    .footer-icon {
      width: 46px;
      height: 46px;
    }

    .footer-icon i {
      font-size: 24px;
    }
  }
</style>

<footer>
  <div class="footer-content">

    <div class="copyright">
      Georgios P. Georgiou (c) 2026
    </div>

    <div class="footer-icons">

      <a
        class="footer-icon"
        href="https://en.wikipedia.org/wiki/Georgios_P._Georgiou"
        target="_blank"
        rel="noopener"
        aria-label="Wikipedia"
        title="Wikipedia"
      >
        <i class="fa-brands fa-wikipedia-w"></i>
      </a>

      <a
        class="footer-icon"
        href="PASTE_GOOGLE_SCHOLAR_URL_HERE"
        target="_blank"
        rel="noopener"
        aria-label="Google Scholar"
        title="Google Scholar"
      >
        <i class="ai ai-google-scholar"></i>
      </a>

      <a
        class="footer-icon"
        href="PASTE_RESEARCHGATE_URL_HERE"
        target="_blank"
        rel="noopener"
        aria-label="ResearchGate"
        title="ResearchGate"
      >
        <i class="ai ai-researchgate"></i>
      </a>

    </div>

  </div>
</footer>

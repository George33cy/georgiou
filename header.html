<!-- header.html -->
<style>
  header {
    background-color: #000;
    display: flex;
    align-items: center;
    padding: 1.5rem 1rem;
    position: relative; /* For hamburger positioning */
  }

  header h1 {
    font-size: 2rem;
    margin: 0;
    color: #fff;
  }

  nav {
    background-color: #000;
    text-align: center;
    padding: 0.5rem 0;
  }

  nav a {
    color: white;
    text-decoration: none;
    margin: 0 0.75rem;
    font-size: 1.3rem;
    font-weight: normal;
  }

  nav a:hover {
    text-decoration: underline;
  }

  /* Hamburger button */
  .menu-toggle {
    display: none;
    flex-direction: column;
    cursor: pointer;
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
  }

  .menu-toggle span {
    height: 3px;
    width: 25px;
    background: #fff;
    margin: 4px 0;
    border-radius: 2px;
  }

  /* Mobile styles */
  @media (max-width: 768px) {
    header {
      justify-content: space-between; /* h1 left, toggle right */
    }

    header h1 {
      text-align: left;
    }

    .menu-toggle {
      display: flex;
      position: static;
      transform: none;
    }

    nav {
      display: none;
      flex-direction: column;
      padding: 1rem;
    }

    nav.active {
      display: flex;
    }

    nav a {
      margin: 0.5rem 0;
      font-size: 1.2rem;
    }
  }

  /* Desktop styles (override mobile) */
  @media (min-width: 769px) {
    header {
      justify-content: center; /* h1 centered */
    }

    header h1 {
      text-align: center;
    }

    .menu-toggle {
      display: none; /* Hide hamburger on desktop */
    }
  }
</style>

<header>
  <h1>Georgios P. Georgiou</h1>
  <div class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('active')">
    <span></span>
    <span></span>
    <span></span>
  </div>
</header>

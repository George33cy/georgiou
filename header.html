<!-- header.html -->
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body,
  body *,
  #header,
  #header * {
    font-family: Helvetica, Arial, sans-serif !important;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background-color: #ffffff;
    color: #102033;
    font-size: 17px;
    line-height: 1.6;
  }

  body {
    overflow-x: hidden;
  }

  a {
    color: #d60000;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  #header {
    margin-bottom: 18px;
  }

  header,
  header *,
  nav,
  nav *,
  .menu-toggle,
  .menu-toggle * {
    font-family: Helvetica, Arial, sans-serif !important;
  }

  header {
    background-color: #000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.7rem 1.9rem;
    position: relative;
  }

  /* Name and icon container */
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    min-width: 0;
  }

  header h1 {
    font-family: Helvetica, Arial, sans-serif !important;
    font-size: 1.7rem;
    margin: 0;
    color: #fff;
    white-space: nowrap;
    font-weight: 700;
    line-height: 1.2;
  }

  /* Image displayed to the right of the name */
  .header-icon {
    width: 100px;
    height: 90px;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 1.2rem;
  }

  nav a {
    font-family: Helvetica, Arial, sans-serif !important;
    color: #fff;
    text-decoration: none;
    font-size: 1.3rem;
    font-weight: normal;
  }

  nav a:hover {
    text-decoration: underline;
  }

  .menu-toggle {
    display: none;
    flex-direction: column;
    cursor: pointer;
    background: transparent;
    border: 0;
    padding: 0;
  }

  .menu-toggle span {
    display: block;
    width: 25px;
    height: 3px;
    margin: 4px 0;
    background: #fff;
    border-radius: 2px;
  }

  @media (max-width: 768px) {
    header {
      padding: 1rem;
      flex-wrap: wrap;
    }

    .header-brand {
      gap: 0.5rem;
      max-width: calc(100% - 55px);
    }

    header h1 {
      font-size: 1.6rem;
      white-space: normal;
    }

    .header-icon {
      width: 70px;
      height: 70px;
    }

    .menu-toggle {
      display: flex;
    }

    nav {
      display: none;
      flex-direction: column;
      background-color: #000;
      width: 100%;
      padding: 1rem 0 0;
      margin-top: 1rem;
      gap: 0;
      position: static;
      flex-basis: 100%;
    }

    nav.active {
      display: flex;
    }

    nav a {
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
      text-align: center;
      width: 100%;
    }
  }
</style>

<header>
  <div class="header-brand">
    <h1>Georgios P. Georgiou</h1>

    <img
      src="header_icon.png"
      alt="Audio waveform and machine learning icon"
      class="header-icon"
    >
  </div>

  <button
    class="menu-toggle"
    type="button"
    aria-label="Toggle menu"
    aria-controls="site-nav"
    aria-expanded="false"
    onclick="
      const nav = this.nextElementSibling;
      const open = !nav.classList.contains('active');
      nav.classList.toggle('active', open);
      this.setAttribute('aria-expanded', String(open));
    "
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav id="site-nav">
    <a
      href="index.html"
      onclick="
        this.closest('nav').classList.remove('active');
        this.closest('nav').previousElementSibling.setAttribute(
          'aria-expanded',
          'false'
        );
      "
    >
      Home
    </a>

    <a
      href="https://www.unic.ac.cy/phonetic-lab/"
      target="_blank"
      rel="noopener"
      onclick="
        this.closest('nav').classList.remove('active');
        this.closest('nav').previousElementSibling.setAttribute(
          'aria-expanded',
          'false'
        );
      "
    >
      Phonetic Lab
    </a>

    <a
      href="publications.html"
      onclick="
        this.closest('nav').classList.remove('active');
        this.closest('nav').previousElementSibling.setAttribute(
          'aria-expanded',
          'false'
        );
      "
    >
      Publications
    </a>

    <a
      href="research.html"
      onclick="
        this.closest('nav').classList.remove('active');
        this.closest('nav').previousElementSibling.setAttribute(
          'aria-expanded',
          'false'
        );
      "
    >
      Research
    </a>

    <a
      href="Georgios Georgiou academic cv.pdf"
      target="_blank"
      rel="noopener"
      onclick="
        this.closest('nav').classList.remove('active');
        this.closest('nav').previousElementSibling.setAttribute(
          'aria-expanded',
          'false'
        );
      "
    >
      CV
    </a>

    <a
      href="contact.html"
      onclick="
        this.closest('nav').classList.remove('active');
        this.closest('nav').previousElementSibling.setAttribute(
          'aria-expanded',
          'false'
        );
      "
    >
      Contact
    </a>
  </nav>
</header>

<!-- header.html -->
<style>
  /* Base header styles (mobile-first) */
  header {
    background-color: #000;
    display: flex;
    justify-content: space-between; /* mobile default */
    align-items: center;
    padding: 1.5rem 1rem;
  }

  header h1 {
    font-size: 2rem;
    margin: 0;
    color: #fff;
  }

  nav {
    background-color: #000;
    text-align: center;
    padding: 0.5rem 0;
  }

  nav a {
    color: white;
    text-decoration: none;
    margin: 0 0.75rem;
    font-size: 1.3rem;
    font-weight: normal;
  }

  nav a:hover {
    text-decoration: underline;
  }

  /* Hamburger button */
  .menu-toggle {
    display: none;            /* hidden by default */
    flex-direction: column;
    cursor: pointer;
  }

  .menu-toggle span {
    height: 3px;
    width: 25px;
    background: #fff;
    margin: 4px 0;
    border-radius: 2px;
  }

  /* Mobile styles */
  @media (max-width: 768px) {
    nav {
      display: none;
      flex-direction: column;
      padding: 1rem;
    }
    nav.active { display: flex; }

    .menu-toggle { display: flex; }

    nav a {
      margin: 0.5rem 0;
      font-size: 1.2rem;
    }
  }

  /* Desktop: center the title, hide burger */
  @media (min-width: 769px) {
    header {
      display: block;       /* stop flex spacing */
      text-align: center;   /* center the h1 */
    }
    header h1 { margin: 0; }
    .menu-toggle { display: none !important; }
  }
</style>

<header>
  <h1>Georgios P. Georgiou</h1>
  <div class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('active')">
    <span></span>
    <span></span>
    <span></span>
  </div>
</header>

<!-- header.html -->
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body,
  body *,
  #header,
  #header *,
  #footer-placeholder,
  #footer-placeholder * {
    font-family: Helvetica !important;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background-color: #ffffff;
    color: #102033;
    font-size: 17px;
    line-height: 1.6;
  }

  body {
    overflow-x: hidden;
  }

  a {
    color: #d60000;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  #header {
    margin-bottom: 18px;
  }

  #footer-placeholder {
    margin: 0;
    padding: 0;
  }

  #footer-placeholder footer {
    margin-top: 0 !important;
    margin-bottom: 0 !important;
    padding-bottom: 0 !important;
  }

  header,
  header *,
  nav,
  nav *,
  .menu-toggle,
  .menu-toggle * {
    font-family: Helvetica !important;
  }

  header {
    background-color: #000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 1.5rem;
    position: relative;
  }

  header h1 {
    font-family: Helvetica !important;
    font-size: 2rem;
    margin: 0;
    color: #fff;
    white-space: nowrap;
    font-weight: 700;
    line-height: 1.2;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 1.2rem;
  }

  nav a {
    font-family: Helvetica !important;
    color: #fff;
    text-decoration: none;
    font-size: 1.3rem;
    font-weight: normal;
  }

  nav a:hover {
    text-decoration: underline;
  }

  .menu-toggle {
    display: none;
    flex-direction: column;
    cursor: pointer;
    background: transparent;
    border: 0;
    padding: 0;
  }

  .menu-toggle span {
    height: 3px;
    width: 25px;
    background: #fff;
    margin: 4px 0;
    border-radius: 2px;
    display: block;
  }

  @media (max-width: 768px) {
    header {
      padding: 1rem;
    }

    header h1 {
      font-size: 1.6rem;
    }

    .menu-toggle {
      display: flex;
    }

    nav {
      display: none;
      flex-direction: column;
      background-color: #000;
      width: 100%;
      padding: 1rem 0;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 999;
      gap: 0;
    }

    nav.active {
      display: flex;
    }

    nav a {
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
      text-align: center;
      width: 100%;
    }
  }
</style>

<header>
  <h1>Georgios P. Georgiou</h1>

  <button
    class="menu-toggle"
    type="button"
    role="button"
    aria-label="Toggle menu"
    aria-controls="site-nav"
    aria-expanded="false"
    onclick="const nav = this.nextElementSibling; const open = !nav.classList.contains('active'); nav.classList.toggle('active', open); this.setAttribute('aria-expanded', String(open));"
    onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); this.click(); }"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav id="site-nav">
    <a href="index.html" onclick="this.closest('nav').classList.remove('active'); this.closest('nav').previousElementSibling.setAttribute('aria-expanded', 'false');">Home</a>
    <a href="https://www.unic.ac.cy/phonetic-lab/" target="_blank" rel="noopener" onclick="this.closest('nav').classList.remove('active'); this.closest('nav').previousElementSibling.setAttribute('aria-expanded', 'false');">Phonetic Lab</a>
    <a href="publications.html" onclick="this.closest('nav').classList.remove('active'); this.closest('nav').previousElementSibling.setAttribute('aria-expanded', 'false');">Publications</a>
    <a href="research.html" onclick="this.closest('nav').classList.remove('active'); this.closest('nav').previousElementSibling.setAttribute('aria-expanded', 'false');">Research</a>
    <a href="Georgios Georgiou academic cv.pdf" target="_blank" rel="noopener" onclick="this.closest('nav').classList.remove('active'); this.closest('nav').previousElementSibling.setAttribute('aria-expanded', 'false');">CV</a>
    <a href="contact.html" onclick="this.closest('nav').classList.remove('active'); this.closest('nav').previousElementSibling.setAttribute('aria-expanded', 'false');">Contact</a>
  </nav>
</header>

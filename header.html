<style>
  /* =========================================================
     SITE-WIDE CONFIGURATION
     These rules apply to every page that loads this header.
  ========================================================= */

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background-color: #ffffff;
    color: #102033;
    font-family: Helvetica, Arial, sans-serif !important;
    font-size: 17px;
    line-height: 1.6;
  }

  body {
    overflow-x: hidden;
  }

  body * {
    font-family: Helvetica, Arial, sans-serif !important;
  }

  a {
    color: #d60000;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  #header {
    margin-bottom: 18px;
  }

  #footer-placeholder {
    margin: 0;
    padding: 0;
  }

  #footer-placeholder footer {
    margin-top: 0 !important;
    margin-bottom: 0 !important;
    padding-bottom: 0 !important;
  }

  /* =========================================================
     HEADER
  ========================================================= */

  header,
  header *,
  nav,
  nav *,
  .menu-toggle,
  .menu-toggle * {
    font-family: Helvetica, Arial, sans-serif !important;
  }

  header {
    background-color: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 156px;
    padding: 0 40px 0 50px;
    position: relative;
    line-height: 1.2;
    border-bottom: 1px solid #cfcfcf;
  }

  header h1 {
    font-size: 2.15rem;
    margin: 0;
    color: #fff;
    white-space: nowrap;
    font-weight: 700;
    line-height: 1.2;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 1.4rem;
    white-space: nowrap;
  }

  nav a {
    color: #fff;
    text-decoration: none;
    font-size: 1.38rem;
    font-weight: normal;
    line-height: 1.2;
  }

  nav a:hover {
    text-decoration: underline;
  }

  .menu-toggle {
    display: none;
    flex-direction: column;
    cursor: pointer;
  }

  .menu-toggle span {
    height: 3px;
    width: 25px;
    background: #fff;
    margin: 4px 0;
    border-radius: 2px;
  }

  /* =========================================================
     MOBILE HEADER
  ========================================================= */

  @media (max-width: 768px) {
    header {
      min-height: auto;
      padding: 1rem;
    }

    header h1 {
      font-size: 1.6rem;
    }

    .menu-toggle {
      display: flex;
    }

    nav {
      display: none;
      flex-direction: column;
      background-color: #000;
      width: 100%;
      padding: 1rem 0;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 999;
      gap: 0;
    }

    nav.active {
      display: flex;
    }

    nav a {
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
      text-align: center;
      width: 100%;
    }
  }
</style>

<header>
  <h1>Georgios P. Georgiou</h1>

  <div
    class="menu-toggle"
    role="button"
    aria-label="Toggle menu"
    aria-expanded="false"
    tabindex="0"
    onclick="
      const nav = this.nextElementSibling;
      const open = !nav.classList.contains('active');
      nav.classList.toggle('active', open);
      this.setAttribute('aria-expanded', String(open));
    "
    onkeydown="
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        this.click();
      }
    "
  >
    <span></span>
    <span></span>
    <span></span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="https://www.unic.ac.cy/phonetic-lab/" target="_blank" rel="noopener">Phonetic Lab</a>
    <a href="publications.html">Publications</a>
    <a href="research.html">Research</a>
    <a href="Georgios Georgiou academic cv.pdf" target="_blank" rel="noopener">CV</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

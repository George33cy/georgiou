<!-- header.html -->
<style>
  #header,
  #header *,
  header,
  header *,
  nav,
  nav *,
  .menu-toggle,
  .menu-toggle * {
    box-sizing: border-box;
    font-family: Helvetica !important;
  }

  #header {
    margin-bottom: 18px;
  }

  header {
    background-color: #000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    position: relative;
    width: 100%;
    margin: 0;
  }

  header h1 {
    font-family: Helvetica !important;
    font-size: 32px;
    line-height: 1.2;
    margin: 0;
    color: #fff;
    white-space: nowrap;
    font-weight: 700;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 19px;
    margin: 0;
    padding: 0;
  }

  nav a {
    font-family: Helvetica !important;
    color: #fff !important;
    text-decoration: none;
    font-size: 21px;
    line-height: 1.3;
    font-weight: normal;
    margin: 0;
    padding: 0;
  }

  nav a:hover {
    text-decoration: underline;
  }

  .menu-toggle {
    display: none;
    flex-direction: column;
    cursor: pointer;
    margin: 0;
    padding: 0;
  }

  .menu-toggle span {
    display: block;
    height: 3px;
    width: 25px;
    background: #fff;
    margin: 4px 0;
    border-radius: 2px;
  }

  @media (max-width: 768px) {
    header {
      padding: 16px;
    }

    header h1 {
      font-size: 26px;
    }

    .menu-toggle {
      display: flex;
    }

    nav {
      display: none;
      flex-direction: column;
      align-items: center;
      background-color: #000;
      width: 100%;
      padding: 16px 0;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 999;
      gap: 0;
    }

    nav.active {
      display: flex;
    }

    nav a {
      padding: 8px 16px;
      font-size: 19px;
      text-align: center;
      width: 100%;
    }
  }

  @media (max-width: 480px) {
    header h1 {
      font-size: 22px;
    }

    nav a {
      font-size: 18px;
    }
  }
</style>

<header>
  <h1>Georgios P. Georgiou</h1>

  <div
    class="menu-toggle"
    role="button"
    aria-label="Toggle menu"
    aria-expanded="false"
    tabindex="0"
    onclick="
      const nav = this.nextElementSibling;
      const open = !nav.classList.contains('active');
      nav.classList.toggle('active', open);
      this.setAttribute('aria-expanded', String(open));
    "
    onkeydown="
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        this.click();
      }
    "
  >
    <span></span>
    <span></span>
    <span></span>
  </div>

  <nav
    onclick="
      const link = event.target.closest('a');
      if (link) {
        this.classList.remove('active');
        this.previousElementSibling.setAttribute('aria-expanded', 'false');
      }
    "
  >
    <a href="index.html">Home</a>
    <a href="https://www.unic.ac.cy/phonetic-lab/" target="_blank" rel="noopener">Phonetic Lab</a>
    <a href="publications.html">Publications</a>
    <a href="research.html">Research</a>
    <a href="Georgios Georgiou academic cv.pdf" target="_blank" rel="noopener">CV</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

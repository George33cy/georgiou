<!-- header.html -->
<style>
  header {
    background-color: #000;
    text-align: center;          /* desktop unchanged */
    padding: 2rem 1rem 1rem;
    position: relative;          /* allow absolute-positioned hamburger on mobile */
  }

  header h1 {
    font-size: 2rem;
    margin: 0;
    color: #fff;
  }

  nav {
    background-color: #000;
    text-align: center;          /* desktop unchanged */
    padding: 0.5rem 0;
  }

  nav a {
    color: white;
    text-decoration: none;
    margin: 0 0.75rem;
    font-size: 1.3rem;
    font-weight: normal;
  }

  nav a:hover {
    text-decoration: underline;
  }

  /* Hamburger (hidden on desktop) */
  .menu-toggle {
    display: none;               /* default: hidden for desktop */
    background: none;
    border: none;
    color: #fff;
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
  }

  /* --- MOBILE ONLY --- */
  @media (max-width: 768px) {
    /* Show hamburger at top-right; keep desktop layout otherwise */
    .menu-toggle {
      display: block;
      position: absolute;
      right: 1rem;
      top: 1.1rem;
    }

    /* Hide nav until opened */
    nav {
      display: none;
      padding: 0; /* tighter on mobile; links get their own padding */
    }

    nav.active {
      display: block;
    }

    /* Stack links vertically on mobile */
    nav a {
      display: block;
      margin: 0;                 /* remove inline spacing */
      padding: 1rem;
      border-top: 1px solid #333;
      font-size: 1.1rem;         /* a bit smaller fits better on phones */
    }
  }
</style>

<header>
  <h1>Georgios P. Georgiou</h1>
  <!-- Mobile-only hamburger (positioned top-right). Hidden on desktop by CSS. -->
  <button class="menu-toggle" aria-label="Menu" aria-expanded="false" onclick="(function(btn){
    var nav=document.getElementById('navMenu');
    if(!nav) return;
    var open=nav.classList.toggle('active');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  })(this)">☰</button>
</header>

<nav id="navMenu">
  <a href="index.html">Home</a>
  <a href="https://www.unic.ac.cy/phonetic-lab/" target="_blank">Phonetic Lab</a>
  <a href="publications.html">Publications</a>
  <a href="research.html">Research</a>
  <a href="teaching.html">Teaching</a>
  <a href="Georgios Georgiou academic cv.pdf" target="_blank">CV</a>
  <a href="contact.html">Contact</a>
</nav>

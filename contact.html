<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact – Georgios P. Georgiou</title>

  <style>
    main.contact-page {
      max-width: 1050px;
      margin: 0 auto;
      padding: 0 20px 40px;
      text-align: center;
    }

    .contact-header {
      padding: 0 0 38px;
    }

    .contact-header h1 {
      margin: 0 0 18px;
      color: #26394a;
      font-size: 34px;
      line-height: 1.15;
      font-weight: 700;
    }

    .contact-header p {
      margin: 0;
      color: #2d8ed6;
      font-size: 22px;
      line-height: 1.45;
      font-weight: 400;
    }

    .contact-header a {
      color: #2d8ed6;
      text-decoration: none;
    }

    .contact-header a:hover {
      text-decoration: underline;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .contact-card {
      min-height: 165px;
      padding: 24px 14px 22px;
      border: 1px solid #e0e5ea;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      color: #26394a;
      font-size: 19px;
      line-height: 1.2;
      font-weight: 700;
    }

    .card-icon {
      width: 26px;
      height: 26px;
      fill: #2d8ed6;
      flex-shrink: 0;
    }

    .card-text {
      color: #444;
      font-size: 15.5px;
      line-height: 1.45;
      font-weight: 400;
      word-break: normal;
    }

    .card-text a {
      color: #00a4e4;
      text-decoration: none;
    }

    .card-text a:hover {
      text-decoration: underline;
    }

    .email-text a {
      white-space: nowrap;
    }

    @media (max-width: 1000px) {
      main.contact-page {
        max-width: 720px;
      }

      .contact-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
    }

    @media (max-width: 600px) {
      main.contact-page {
        padding: 0 14px 36px;
      }

      .contact-header {
        padding-bottom: 30px;
      }

      .contact-header h1 {
        font-size: 30px;
      }

      .contact-header p {
        font-size: 19px;
      }

      .contact-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .contact-card {
        min-height: auto;
        padding: 22px 14px 20px;
      }

      .card-title {
        font-size: 18px;
        margin-bottom: 14px;
      }

      .card-text {
        font-size: 15px;
      }

      .card-icon {
        width: 24px;
        height: 24px;
      }
    }
  </style>
</head>

<body>

  <div id="header"></div>

  <main class="contact-page">

    <section class="contact-header">
      <h1>Contact Information</h1>

      <p>
        <a href="https://www.unic.ac.cy/georgiou-george/" target="_blank" rel="noopener">
          Georgios P. Georgiou
        </a>
      </p>

      <p>Department of Languages and Literature</p>
    </section>

    <section class="contact-grid">

      <div class="contact-card">
        <div class="card-title">
          <svg class="card-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"></path>
          </svg>
          <span>Email</span>
        </div>

        <div class="card-text email-text">
          <a href="mailto:georgiou.georg@unic.ac.cy">georgiou.georg@unic.ac.cy</a>
        </div>
      </div>

      <div class="contact-card">
        <div class="card-title">
          <svg class="card-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.11-.21c1.21.48 2.53.75 3.87.75a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.34.27 2.66.75 3.87a1 1 0 01-.21 1.11l-2.42 2.81z"></path>
          </svg>
          <span>Telephone</span>
        </div>

        <div class="card-text">
          <a href="tel:+35722842231">+357 22842231</a>
        </div>
      </div>

      <div class="contact-card">
        <div class="card-title">
          <svg class="card-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 21V8l9-5 9 5v13h-6v-7H9v7H3zm8-9h2V9h-2v3z"></path>
          </svg>
          <span>Office</span>
        </div>

        <div class="card-text">
          Office No: 104a<br>
          Humanities Building
        </div>
      </div>

      <div class="contact-card">
        <div class="card-title">
          <svg class="card-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 8h-3V4H7v4H4c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2zM9 6h6v2H9V6zm11 13H4v-5l8 4 8-4v5zm-8-3l-8-4v-2h16v2l-8 4z"></path>
          </svg>
          <span>Postal Address</span>
        </div>

        <div class="card-text">
          Makedonitissis 46<br>
          2417<br>
          University of Nicosia<br>
          Nicosia, Cyprus
        </div>
      </div>

    </section>

  </main>

  <div id="footer-placeholder"></div>

  <script>
    fetch("header.html")
      .then(response => response.text())
      .then(html => {
        document.getElementById("header").innerHTML = html;
      })
      .catch(error => console.error("Error loading header:", error));
  </script>

  <script>
    fetch("footer.html")
      .then(response => response.text())
      .then(html => {
        document.getElementById("footer-placeholder").innerHTML = html;
      })
      .catch(error => console.error("Error loading footer:", error));
  </script>

</body>
</html>
